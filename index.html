<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vex Path Gen</title>
    <link rel="icon" href="src/assets/icon.png" type="image/x-icon" />
  </head>
  <body>

    <div class="cursor-dot" id="cursorDot"></div>


    <div id="screen">
      <div id= "top">

        <div id="path-container">
          <div id="left-panel">
            <div id="mouse-coordinates"></div>
            <div id="path-settings-panel">
              <div id="field-panel">
                <label for="fieldSelect" id="field-label">Field</label>
                <select id="fieldSelect" aria-label="Field selection">
                  <option value="H2H" selected>Match</option>
                  <option value="Skills">Skills</option>
                </select>
              </div>
              <div class="panel-divider" aria-hidden="true"></div>
              <div id="mode-panel">
                <label for="modeSelect" id="mode-label">Path Type - E to toggle</label>
                <select id="modeSelect" aria-label="Drawing mode">
                  <option value="Bezier" selected>Bezier</option>
                  <option value="Line">Line</option>
                </select>
              </div>
              <div class="panel-divider" aria-hidden="true"></div>
              <div id="control-points-panel">
                <div id="control-points-label">Control Points</div>
                <div id="control-points-actions">
                  <button id="showPoints">Show</button>
                  <button id="hidePoints">Hide</button>
                </div>
              </div>
            </div>
            <div id="menu">
              <div id="botconfig">
                <div class="field">
                  <label for="botlen">Bot width:</label>
                  <input type="number" id="botwidth" value="13.5" />
                </div>
                <div class="field">
                  <label for="botwidth">Bot length:</label>
                  <input type="number" id="botlen" value="15" />
                </div>
                <div class="field">
                  <label for="trackwidth">Track width:</label>
                  <input type="number" id="trackwidth" value="10.5" />
                </div>
              </div>
              <div id="botconfig">
                <div class="field">
                  <label for="maxaccel">Max Acceleration:</label>
                  <input type="number" id="maxaccel" value="100" />
                </div>
                <div class="field">
                  <label for="maxdecel">Max Deceleration:</label>
                  <input type="number" id="maxdecel" value="120" />
                </div>
                <div class="field">
                  <label for="maxvel">Max Velocity:</label>
                  <input type="number" id="maxvel" value="80" />
                </div>
              </div>
            </div>
            <div id="file-actions">
              <button id="saveCpp">Export Paths</button>
              <button id="importFolder" class="file-upload-button" type="button">Import Paths</button>
            </div>
          </div>
          <canvas id="path"></canvas>
        </div>

        <div id="sidebar">
          <div id="graph-section">
            <div id="graphs-container-container">
              <div id="graph-side-controls">
                <button id="play" aria-label="Play path">></button>
                <button id="pause" aria-label="Pause path">||</button>
              </div>
              <div id="graph-readout">
                <div id="currtime-label" class="graph-label">0.0s</div>
                <div id="currvel-label" class="graph-label">0 in/s</div>
              </div>
              <div id="graphs-container">
                <canvas id="graph" width="600" height="280"></canvas>
                <canvas id="overlay" width="600" height="280"></canvas>

                <!-- Time Label for the Bottom -->
                <div id="unit-label" class="graph-label">TIME (S)</div>
                <div id="velocity-label" class="graph-label">Vel<br />(in/s)</div>

                <!-- Time Start and End Labels -->
                <div id="start-time-label" class="graph-label">0.00</div>
                <div id="end-time-label" class="graph-label">0.00</div>

                <!-- Velocity Markings -->
                <div id="velocity-max-label" class="graph-label">60</div>
                <div id="velocity-zero-label" class="graph-label">0</div>
                <!-- For max velocity -->
              </div>
              <div id="graph-key">
                <div>
                  <span class="circle" style="background-color: white"></span>
                  <span>velocity</span>
                </div>
                <div>
                  <span class="circle" style="background-color: red"></span>
                  <span>left</span>
                </div>
                <div>
                  <span class="circle" style="background-color: blue"></span>
                  <span>right</span>
                </div>
                <div>
                  <span class="circle" style="background-color: black"></span>
                  <span>angular</span>
                </div>
              </div>
            </div>
          </div>
        <div id="segment-panel">
          <div class="path-tree-header">
            <div class="path-tree-title">Paths</div>
            <button id="addPath">Add Path</button>
          </div>
          <div id="segment-config">
            <div id="path-tree"></div>
          </div>
        </div>
        </div>
      </div> 
    </div>

    <div id="path-delete-modal" class="modal is-hidden" role="dialog" aria-modal="true" aria-labelledby="path-delete-title">
      <div class="modal-scrim" id="path-delete-scrim"></div>
      <div class="modal-card">
        <h2 id="path-delete-title">Delete path?</h2>
        <p id="path-delete-message">This will remove the path and its segments.</p>
        <div class="modal-actions">
          <button id="path-delete-cancel" class="modal-button secondary" type="button">Cancel</button>
          <button id="path-delete-confirm" class="modal-button danger" type="button">Delete</button>
        </div>
      </div>
    </div>

    <!-- Entrypoint -->
    <script src="src/index.ts" type="module"></script>
  </body>
</html>
